<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../iconn.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | ECA-Connect</title>
    <!-- Anti-FOUC -->
    <script>try{var t=localStorage.getItem('lc_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { min-height:100vh; display:flex; flex-direction:column; background:var(--base-black); }
        .login-nav { padding:var(--space-16) var(--space-24); border-bottom:1px solid var(--glass-border); display:flex; align-items:center; justify-content:space-between; background:var(--glass-bg); backdrop-filter:blur(16px); }
        .login-main { flex:1; display:flex; align-items:center; justify-content:center; padding:var(--space-32) var(--space-16); }
        .login-card { width:100%; max-width:420px; background:var(--surface-100); border:1px solid var(--glass-border); border-radius:var(--radius-2xl); box-shadow:var(--shadow-xl); padding:var(--space-40) var(--space-32); position:relative; }
        .login-card::before { content:''; position:absolute; top:0; left:20px; right:20px; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent); }
    </style>
</head>

<body>
    <nav class="login-nav">
        <a href="../index.html" style="font-family:var(--font-headings); font-weight:800; color:var(--base-white); text-decoration:none; letter-spacing:-0.03em;">LetsConnect</a>
        <button class="theme-toggle-btn" aria-label="Toggle theme"><span class="theme-icon"></span></button>
    </nav>
    <main class="login-main">
    <div class="login-card">

        <!-- Verification Pending Banner -->
        <div id="verify-banner" style="display:none; padding:12px; background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.4); border-radius:8px; margin-bottom:16px; color:#22c55e; font-size:var(--text-sm);">
            ✅ Account created! Please check your email and click the verification link before logging in.
        </div>

        <!-- Error Message -->
        <div id="error-message"
            style="display: none; padding: 12px; background: #fee; border: 1px solid #fcc; border-radius: 8px; margin-bottom: 16px; color: #c33;">
        </div>

        <!-- Email Not Verified Box -->
        <div id="verify-error" style="display:none; padding:14px; background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.4); border-radius:8px; margin-bottom:16px; color:#fbbf24;">
            <p style="margin:0 0 8px 0; font-size:var(--text-sm);">⚠️ Your email is not verified. Please check your inbox and click the verification link.</p>
            <button id="resend-btn" type="button" style="background:none; border:1px solid #fbbf24; color:#fbbf24; padding:4px 12px; border-radius:6px; cursor:pointer; font-size:var(--text-xs);">Resend verification email</button>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="label">Email</label>
                <input id="email" type="email" class="input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="label">Password</label>
                <input id="password" type="password" class="input" placeholder="••••••••" required>
            </div>

            <button id="login-btn" type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: var(--space-8);">
                Log In
            </button>

            <div style="text-align: center; margin: 16px 0; color: var(--text-muted);">or</div>

            <button id="google-btn" type="button" class="btn btn-google"
                style="margin-top: var(--space-8); justify-content: center;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                    style="width: 20px; height: 20px; margin-right: 8px;">
                Continue with Google
            </button>
        </form>

        <p class="text-muted" style="text-align: center; margin-top: var(--space-24); font-size: var(--text-sm);">
            Don't have an account? <a href="signup.html" style="color: var(--primary-600);">Sign up</a>
        </p>
    </div>

    <!-- Firebase Authentication Integration -->
    <script type="module">
        import { authService } from '../js/auth-service.js';
        import { redirectIfAuthenticated } from '../js/route-guard.js';

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const googleBtn = document.getElementById('google-btn');
        const errorMessage = document.getElementById('error-message');

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Set loading state
        function setLoading(isLoading, button) {
            if (isLoading) {
                button.disabled = true;
                button.dataset.originalText = button.textContent;
                button.textContent = 'Loading...';
            } else {
                button.disabled = false;
                button.textContent = button.dataset.originalText;
            }
        }

        const verifyBanner = document.getElementById('verify-banner');
        const verifyError  = document.getElementById('verify-error');
        const resendBtn    = document.getElementById('resend-btn');

        // Show pending-verification banner if redirected from signup
        if (new URLSearchParams(window.location.search).get('verified') === 'pending') {
            verifyBanner.style.display = 'block';
        }

        // Track the last-logged-in user for the resend button
        let lastLoginUser = null;

        // Email/Password Login
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            verifyError.style.display  = 'none';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            setLoading(true, loginBtn);

            const result = await authService.loginWithEmail(email, password);

            if (result.success) {
                // Block unverified email/password users
                if (!result.user.emailVerified) {
                    lastLoginUser = result.user;
                    // Sign them back out so session isn't created
                    await authService.logout();
                    setLoading(false, loginBtn);
                    verifyError.style.display = 'block';
                    return;
                }

                const profile = await authService.loadUserProfile(result.user.uid);

                // Redirect based on profile completion
                if (profile && profile.profileComplete) {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'profile-setup.html';
                }
            } else {
                setLoading(false, loginBtn);
                showError(result.error);
            }
        });

        // Resend verification email
        resendBtn.addEventListener('click', async () => {
            const result = await authService.resendVerificationEmail(emailInput.value.trim(), passwordInput.value);
            if (result.success) {
                resendBtn.textContent = '✅ Email sent!';
                resendBtn.disabled = true;
            } else {
                resendBtn.textContent = 'Failed — try again';
            }
        });

        // Google OAuth Login
        googleBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';

            setLoading(true, googleBtn);

            const result = await authService.loginWithGoogle();

            if (result.success) {
                const profile = await authService.loadUserProfile(result.user.uid);

                // Redirect based on profile completion
                if (profile && profile.profileComplete) {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'profile-setup.html';
                }
            } else {
                setLoading(false, googleBtn);
                if (result.error !== 'Login cancelled') {
                    showError(result.error);
                }
            }
        });

        // Check if already authenticated
        redirectIfAuthenticated();
    </script>

    <script type="module" src="../js/theme-toggle.js"></script>
</main>
</body>

</html>
