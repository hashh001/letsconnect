<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Group | ECA-Connect</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <nav style="padding: var(--space-16); border-bottom: 1px solid var(--surface-200);">
        <div style="max-width: 800px; margin: 0 auto;">
            <a href="dashboard.html" class="btn btn-ghost">← Back</a>
        </div>
    </nav>

    <main style="max-width: 800px; margin: 0 auto; padding: var(--space-32) var(--space-16);">
        <h1>Create a New Group</h1>

        <form class="form-group" style="gap: var(--space-24);">

            <!-- Basic Info -->
            <div class="form-group">
                <label class="label">Group Name</label>
                <input type="text" class="input" placeholder="e.g. Sunday Morning Hiking">
            </div>

            <div class="form-group">
                <label class="label">Category</label>
                <select class="select">
                    <option>Sports</option>
                    <option>Education</option>
                    <option>Social</option>
                </select>
            </div>

            <!-- Schedule -->
            <div style="background: var(--surface-50); padding: var(--space-16); border-radius: var(--radius-md);">
                <h4 style="margin-bottom: var(--space-16);">Schedule</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-16);">
                    <div class="form-group">
                        <label class="label">Day</label>
                        <select class="select">
                            <option>Saturday</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="label">Time</label>
                        <input type="time" class="input" value="18:00">
                    </div>
                </div>
                <label class="label"
                    style="display: flex; align-items: center; gap: var(--space-8); margin-top: var(--space-8);">
                    <input type="checkbox"> Recurring Weekly
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Create Group</button>
        </form>
    </main>
</body>

</html>
