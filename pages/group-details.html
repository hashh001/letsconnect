<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Details | ECA-Connect</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <nav style="padding: var(--space-16); border-bottom: 1px solid var(--surface-200);">
        <div style="max-width: 800px; margin: 0 auto;">
            <a href="dashboard.html" class="btn btn-ghost">← Back</a>
        </div>
    </nav>

    <!-- Hero Image -->
    <div id="gd-hero-color"
        style="height: 200px; background: var(--surface-200); max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 64px; color: rgba(255,255,255,0.8);">
        <!-- Icon/Initial goes here -->
    </div>

    <main style="max-width: 800px; margin: 0 auto; padding: var(--space-24);">

        <header style="margin-bottom: var(--space-24);">
            <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                    <h1 id="gd-title">Loading...</h1>
                    <p class="text-muted">Managed by <span style="color: var(--base-white);">Sarah J.</span></p>
                </div>
                <button id="gd-join-btn" class="btn btn-primary btn-lg">Join Group</button>
            </div>
        </header>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-32);">

            <!-- Left Info -->
            <section>
                <!-- Compatibility Meter -->
                <div style="margin-bottom: var(--space-32);">
                    <div
                        style="display: flex; justify-content: space-between; font-size: var(--text-sm); margin-bottom: 4px; color: var(--text-muted); font-weight: 500;">
                        <span>Your Compatibility</span>
                        <span id="gd-match-val">--%</span>
                    </div>
                    <div id="gd-meter-container" class="compatibility-meter">
                        <div id="gd-meter-fill" class="meter-fill" style="width: 0%;"></div>
                    </div>
                </div>

                <h3>About</h3>
                <p id="gd-desc" style="line-height: 1.6; color: var(--base-black);">...</p>

                <h3 style="margin-top: var(--space-24);">Schedule</h3>
                <div
                    style="background: var(--surface-100); border: 1px solid var(--surface-200); padding: var(--space-16); border-radius: var(--radius-md); display: flex; gap: var(--space-16); align-items: center;">
                    <div
                        style="font-size: 24px; background: var(--primary-50); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                        📅</div>
                    <div>
                        <strong id="gd-schedule" style="display: block; margin-bottom: 4px;">...</strong>
                        <span id="gd-next-session" class="text-muted" style="font-size: var(--text-sm);">Next session:
                            ...</span>
                    </div>
                </div>
            </section>

            <!-- Right Sidebar -->
            <aside>
                <h4>Members (<span id="gd-member-count">0</span>)</h4>
                <div style="display: flex; gap: -8px; margin-bottom: var(--space-32);">
                    <div class="avatar avatar-s">A</div>
                    <div class="avatar avatar-s">B</div>
                    <div class="avatar avatar-s">C</div>
                    <div class="avatar avatar-s"
                        style="background: var(--surface-200); color: var(--text-muted); font-size: 10px;">+</div>
                </div>

                <h4>Location</h4>
                <p id="gd-location-name"
                    style="font-size: var(--text-sm); margin-top: var(--space-8); color: var(--base-white);">
                    Loading...
                </p>
                <p class="text-muted" style="font-size: var(--text-xs); margin-top: var(--space-4);">
                    <span id="gd-distance">...</span> km away
                </p>

                <!-- Travel Time Estimates -->
                <div id="gd-travel-times" style="margin-top: var(--space-16); display: none;">
                    <h4 style="margin-bottom: var(--space-12);">Travel Time</h4>
                    <div style="display: flex; flex-direction: column; gap: var(--space-8);">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; padding: var(--space-8); background: var(--surface-50); border-radius: var(--radius-sm);">
                            <span style="font-size: var(--text-sm);">🚗 Driving</span>
                            <span id="gd-time-car" class="text-muted"
                                style="font-size: var(--text-sm); font-weight: 500;">...</span>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; padding: var(--space-8); background: var(--surface-50); border-radius: var(--radius-sm);">
                            <span style="font-size: var(--text-sm);">🚲 Cycling</span>
                            <span id="gd-time-bike" class="text-muted"
                                style="font-size: var(--text-sm); font-weight: 500;">...</span>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; padding: var(--space-8); background: var(--surface-50); border-radius: var(--radius-sm);">
                            <span style="font-size: var(--text-sm);">🚶 Walking</span>
                            <span id="gd-time-foot" class="text-muted"
                                style="font-size: var(--text-sm); font-weight: 500;">...</span>
                        </div>
                    </div>
                </div>

                <!-- Get Directions Button -->
                <button id="gd-directions-btn" class="btn btn-secondary"
                    style="width: 100%; margin-top: var(--space-16);">
                    📍 Get Directions
                </button>
            </aside>
        </div>

    </main>

    <script type="module" src="../js/app.js"></script>
</body>

</html>
