<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Groups | ECA-Connect</title>
    <meta name="description" content="View all groups you've joined or requested to join on ECA-Connect.">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .page-header {
            margin-bottom: var(--space-32);
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--base-white);
            margin-bottom: var(--space-16);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .count-badge {
            background: var(--primary-500);
            color: white;
            border-radius: var(--radius-full);
            padding: 2px 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: var(--space-48);
        }
        .group-card {
            background: var(--surface-100);
            border: 1px solid var(--surface-200);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .group-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-500);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .group-card-header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: white;
        }
        .group-card-body {
            padding: 16px;
        }
        .group-card-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--base-white);
            margin-bottom: 6px;
        }
        .group-card-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .group-card-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .status-pill {
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
        }
        .status-pill.member   { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-pill.creator  { background: rgba(234,179,8,0.15);  color: #eab308; }
        .status-pill.pending  { background: rgba(99,102,241,0.15); color: #818cf8; }
        .status-pill.rejected { background: rgba(239,68,68,0.15);  color: #f87171; }
        .leave-btn {
            font-size: 12px;
            padding: 4px 10px;
            margin-left: auto;
        }
        .divider {
            height: 1px;
            background: var(--surface-200);
            margin: var(--space-32) 0;
        }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; margin-bottom: 20px; }
        .skeleton {
            background: var(--surface-100);
            border-radius: var(--radius-lg);
            height: 180px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav style="background: var(--surface-50); padding: var(--space-16); border-bottom: 1px solid var(--surface-200); position: sticky; top: 0; z-index: 100;">
        <div style="max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: var(--space-24);">
            <a href="dashboard.html" style="text-decoration: none; color: var(--base-white); font-family: var(--font-headings); font-weight: 700;">ECA-Connect</a>
            <div style="display: flex; gap: var(--space-16); margin-left: auto; align-items: center;">
                <a href="dashboard.html" class="btn btn-ghost btn-sm">🔍 Discover</a>
                <a href="group-manager.html" class="btn btn-ghost btn-sm" style="position:relative;">
                    👑 Manage Groups
                    <span id="nav-pending-badge" class="nav-badge-pulse" style="display:none;"></span>
                </a>

                <!-- Notification Bell & Dropdown -->
                <div class="notification-wrapper" style="position:relative;">
                    <button class="icon-btn" id="notification-bell" style="background:none; border:none; font-size: 20px; cursor: pointer; position:relative;">
                        🔔
                        <span class="badge nav-badge-pulse" id="notification-badge" style="display: none; position:absolute; top:-4px; right:-4px; background:var(--error); color:white; font-size:10px; padding:2px 6px; border-radius:10px;">0</span>
                    </button>
                    <div class="notification-dropdown" id="notification-dropdown" style="display:none; position:absolute; right:0; top:40px; width:320px; background:var(--surface-50); border:1px solid var(--surface-200); border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.5); z-index:1000;">
                        <div class="dropdown-header" style="padding:12px; border-bottom:1px solid var(--surface-200); display:flex; justify-content:space-between; align-items:center;">
                            <h4 style="margin:0; color:var(--base-white); font-size:14px;">Notifications</h4>
                            <button class="text-btn" id="mark-all-read-btn" style="background:none; border:none; color:var(--primary-400); font-size:12px; cursor:pointer;">Mark all read</button>
                        </div>
                        <div class="dropdown-content" id="notification-list" style="max-height:300px; overflow-y:auto; padding:8px;">
                            <div class="empty-state" style="text-align:center; padding:20px; color:var(--text-muted);">
                                <div class="icon" style="font-size:24px; margin-bottom:8px;">📭</div>
                                <p style="margin:0; font-size:13px;">No new notifications</p>
                            </div>
                        </div>
                    </div>
                </div>

                <a href="profile.html" style="text-decoration: none;">
                    <div class="avatar avatar-s" id="nav-avatar">?</div>
                </a>
            </div>
        </div>
    </nav>

    <main style="max-width: 1100px; margin: 0 auto; padding: var(--space-32) var(--space-24);">
        <!-- Page Header -->
        <div class="page-header">
            <h2 style="margin-bottom: var(--space-8);">My Groups</h2>
            <p class="text-muted">Groups you're a member of and requests you've sent</p>
        </div>

        <!-- Loading -->
        <div id="loading-state">
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 48px;">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </div>

        <!-- Content -->
        <div id="main-content" style="display: none;">

            <!-- Groups I'm In -->
            <section id="joined-section">
                <div class="section-title">
                    ✅ Groups You're In
                    <span class="count-badge" id="joined-count">0</span>
                </div>
                <div class="groups-grid" id="joined-grid"></div>
            </section>

            <div class="divider"></div>

            <!-- Pending Requests -->
            <section id="pending-section">
                <div class="section-title">
                    ⏳ Pending Requests
                    <span class="count-badge" id="pending-count">0</span>
                </div>
                <div class="groups-grid" id="pending-grid"></div>
            </section>

            <div class="divider" id="rejected-divider" style="display:none;"></div>

            <!-- Rejected Requests (collapsible) -->
            <section id="rejected-section" style="display:none;">
                <div class="section-title" style="cursor:pointer;" id="rejected-toggle">
                    ❌ Rejected Requests
                    <span class="count-badge" id="rejected-count">0</span>
                    <span style="font-size:12px; color: var(--text-muted); margin-left: auto;">▼ Show</span>
                </div>
                <div class="groups-grid" id="rejected-grid" style="display:none;"></div>
            </section>

        </div>
    </main>

    <script type="module" src="../js/my-groups.js"></script>

    <!-- Live navbar badge -->
    <script type="module">
        import { auth } from '../js/firebase-config.js';
        import { joinRequestService } from '../js/join-request-service.js';
        auth.onAuthStateChanged((user) => {
            if (!user) return;
            joinRequestService.subscribeToPendingCount(user.uid, (count) => {
                const badge = document.getElementById('nav-pending-badge');
                if (!badge) return;
                badge.style.display = count > 0 ? 'inline' : 'none';
                badge.textContent   = count > 9 ? '9+' : count;
            });
        });
    </script>
    <script type="module" src="../js/notification-dropdown.js"></script>
</body>
</html>
