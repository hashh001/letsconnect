<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ECA-Connect</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <!-- Top Nav -->
    <nav style="background: var(--surface-50); padding: var(--space-16); border-bottom: 1px solid var(--surface-200);">
        <div
            style="max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
            <a href="dashboard.html" class="btn btn-ghost">← Dashboard</a>
            <div style="font-weight: 700;">My Profile</div>
            <button class="btn btn-ghost" style="color: var(--error-text);">Log Out</button>
        </div>
    </nav>

    <main style="max-width: 800px; margin: 0 auto; padding: var(--space-32) var(--space-16);">

        <!-- Header Profile Card -->
        <header style="display: flex; gap: var(--space-24); align-items: center; margin-bottom: var(--space-32);">
            <div style="position: relative;">
                <div class="avatar avatar-l"
                    style="width: 100px; height: 100px; font-size: 32px; background: var(--primary-100); color: var(--primary-700);">
                    JD</div>
                <button class="btn btn-sm btn-secondary"
                    style="position: absolute; bottom: 0; right: -10px; padding: 4px 8px; background: white; border-radius: 50%; width: 32px; height: 32px;">📷</button>
            </div>
            <div>
                <h1 style="margin-bottom: var(--space-8); font-size: var(--text-h2);">John Doe</h1>
                <p class="text-muted">Joined September 2024</p>
                <div style="display: flex; gap: var(--space-16); margin-top: var(--space-16);">
                    <div style="text-align: center;">
                        <div style="font-weight: 700; font-size: var(--text-lg);">12</div>
                        <div class="text-muted" style="font-size: var(--text-xs);">Groups</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-weight: 700; font-size: var(--text-lg);">98%</div>
                        <div class="text-muted" style="font-size: var(--text-xs);">Reliability</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Settings Grid -->
        <div style="display: grid; gap: var(--space-32);">

            <!-- Bio & Interests -->
            <section class="card" style="padding: var(--space-24);">
                <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-16);">
                    <h3>About Me</h3>
                    <button class="btn btn-ghost btn-sm">Edit</button>
                </div>
                <p style="color: var(--text-description); line-height: 1.6; margin-bottom: var(--space-24);">
                    Love outdoor sports and casual board game nights. Always looking for new badminton partners!
                </p>

                <h4 style="font-size: var(--text-base);">Interests</h4>
                <div style="display: flex; flex-wrap: wrap; gap: var(--space-8);">
                    <span class="tag">🏸 Badminton</span>
                    <span class="tag">💻 Coding</span>
                    <span class="tag">🎲 Board Games</span>
                    <span class="tag"
                        style="background: transparent; border: 1px dashed var(--surface-200); cursor: pointer;">+
                        Add</span>
                </div>
            </section>

            <!-- Availability Settings -->
            <section class="card" style="padding: var(--space-24);">
                <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-16);">
                    <h3>Visual Availability</h3>
                    <button class="btn btn-primary btn-sm">Update Schedule</button>
                </div>

                <div style="background: var(--surface-50); padding: var(--space-16); border-radius: var(--radius-md);">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-8);">
                        <strong>Default Radius</strong>
                        <span>5 km</span>
                    </div>
                    <input type="range" class="range-slider" value="20">
                </div>
            </section>
        </div>

    </main>
</body>

</html>
