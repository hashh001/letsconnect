<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ECA-Connect</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        /* Filter-specific styles */
        .slider {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: var(--surface-200);
            border-radius: var(--radius-full);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-500);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--primary-500);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .interest-tag {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            cursor: pointer;
            border: 1px solid var(--surface-200);
            background: var(--surface-50);
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .interest-tag:hover {
            border-color: var(--primary-400);
        }

        .interest-tag.active {
            background: var(--primary-500);
            color: white;
            border-color: var(--primary-500);
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--primary-50);
            color: var(--primary-700);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
        }

        .filter-chip button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
        }

        .filter-section-divider {
            height: 1px;
            background: var(--surface-200);
            margin: 24px 0;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: var(--text-sm);
            cursor: pointer;
            padding: 10px 12px;
            background: var(--surface-100);
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .checkbox-option:hover {
            background: var(--surface-150);
        }

        .checkbox-option input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
    </style>
</head>

<body>
    <!-- Top Nav -->
    <nav class="dashboard-nav"
        style="background: var(--surface-50); padding: var(--space-16); border-bottom: 1px solid var(--surface-200); position: sticky; top: 0; z-index: 100;">
        <div style="max-width: 1400px; margin: 0 auto; display: flex; gap: var(--space-24); align-items: center;">
            <div
                style="font-family: var(--font-headings); font-weight: 700; color: var(--base-white); white-space: nowrap;">
                ECA-Connect</div>

            <div class="user-menu" style="display: flex; align-items: center; gap: var(--space-16); margin-left: auto;">
                <a href="profile.html" style="text-decoration: none;">
                    <div class="avatar avatar-s">JD</div>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Dashboard with Filters -->
    <main style="max-width: 1400px; margin: 0 auto; padding: var(--space-24);">

        <!-- Welcome Header -->
        <header style="margin-bottom: var(--space-32);">
            <h2 style="margin-bottom: var(--space-8);">Discover Groups</h2>
            <p class="text-muted">Find your perfect community match</p>
        </header>

        <!-- Layout: Filters + Results -->
        <div style="display: grid; grid-template-columns: 320px 1fr; gap: var(--space-32);">

            <!-- Filter Sidebar -->
            <aside id="filter-sidebar" style="position: sticky; top: 100px; height: fit-content;">
                <div style="padding: 0;">
                    <h3 class="sidebar-title">Filters</h3>

                    <!-- Header with Reset -->
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <div style="font-size: 14px; color: var(--text-muted);">Refine results</div>
                        <button id="reset-filters-btn" class="btn-text"
                            style="font-size: var(--text-sm); color: var(--primary-500); padding: 0; background: none; border: none; cursor: pointer; text-decoration: underline;">
                            Reset
                        </button>
                    </div>

                    <!-- Search -->
                    <div style="margin-bottom: 28px;">
                        <label
                            style="font-size: 14px; font-weight: 600; margin-bottom: 12px; display: block; color: var(--base-white);">
                            Search
                        </label>
                        <input type="text" id="filter-search" class="input" placeholder="Search groups..."
                            style="width: 100%; padding: 10px 14px;">
                    </div>

                    <div class="filter-section-divider"></div>

                    <!-- Radius Slider -->
                    <!-- Radius Slider REMOVED -->
                    <div
                        style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--surface-200);">
                        <label class="checkbox-option" style="background: transparent; padding: 0;">
                            <input type="checkbox" id="only-in-radius">
                            <span style="color: var(--base-white); font-weight: 500;">Only show within 5km</span>
                        </label>
                    </div>

                    <div class="filter-section-divider"></div>

                    <!-- Interest Tags -->
                    <div style="margin-bottom: 28px;">
                        <label
                            style="font-size: 14px; font-weight: 600; margin-bottom: 14px; display: block; color: var(--base-white);">
                            Interests
                        </label>
                        <div id="interest-tags" style="display: flex; flex-wrap: wrap; gap: 10px;">
                            <!-- Tags will be populated by JS -->
                        </div>
                    </div>

                    <div class="filter-section-divider"></div>

                    <!-- Time Availability -->
                    <div style="margin-bottom: 28px;">
                        <label
                            style="font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--base-white);">
                            <span>When are you free?</span>
                            <span class="text-muted" style="font-size: 12px; cursor: help;"
                                title="Pre-filled from your profile">ℹ️</span>
                        </label>
                        <div id="availability-display"
                            style="font-size: 13px; color: var(--base-white); margin-bottom: 16px; padding: 14px; background: var(--surface-100); border-radius: var(--radius-md); line-height: 1.7;">
                            <!-- Will show current availability -->
                        </div>
                        <label class="checkbox-option">
                            <input type="checkbox" id="require-time-match">
                            <span>Must match my schedule</span>
                        </label>
                    </div>

                    <div class="filter-section-divider"></div>

                    <!-- Skill Level -->
                    <div style="margin-bottom: 28px;">
                        <label
                            style="font-size: 14px; font-weight: 600; margin-bottom: 12px; display: block; color: var(--base-white);">
                            Skill Level
                        </label>
                        <select id="skill-filter" class="input"
                            style="width: 100%; margin-bottom: 14px; padding: 10px 14px;">
                            <option value="">Any skill level</option>
                            <option value="beginner">Beginner friendly</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                        <label class="checkbox-option">
                            <input type="checkbox" id="strict-skill">
                            <span>Strict skill matching</span>
                        </label>
                    </div>

                    <div class="filter-section-divider"></div>

                    <!-- Privacy -->
                    <div style="margin-bottom: 28px;">
                        <label
                            style="font-size: 14px; font-weight: 600; margin-bottom: 14px; display: block; color: var(--base-white);">
                            Privacy
                        </label>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <label class="checkbox-option">
                                <input type="checkbox" class="privacy-filter" value="Open" checked>
                                <span>Open</span>
                            </label>
                            <label class="checkbox-option">
                                <input type="checkbox" class="privacy-filter" value="Approval" checked>
                                <span>Approval required</span>
                            </label>
                            <label class="checkbox-option">
                                <input type="checkbox" class="privacy-filter" value="Invite">
                                <span>Invite only</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section-divider"></div>

                    <!-- Language -->
                    <div style="margin-bottom: 32px;">
                        <label
                            style="font-size: 14px; font-weight: 600; margin-bottom: 14px; display: block; color: var(--base-white);">
                            Language
                        </label>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <label class="checkbox-option">
                                <input type="checkbox" class="language-filter" value="English" checked>
                                <span>English</span>
                            </label>
                            <label class="checkbox-option">
                                <input type="checkbox" class="language-filter" value="Hindi" checked>
                                <span>Hindi</span>
                            </label>
                        </div>
                    </div>

                    <!-- Apply Button -->
                    <button id="apply-filters-btn" class="btn btn-primary"
                        style="width: 100%; padding: 14px; font-size: 15px; font-weight: 600;">
                        Apply Filters
                    </button>
                </div>

                <!-- Active Filters Chips -->
                <div id="active-filters" style="margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px;">
                    <!-- Filter chips will be added here -->
                </div>
            </aside>

            <!-- Results Section -->
            <div>
                <!-- Results Header -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <span class="text-muted" style="font-size: 14px;">
                            <span id="total-results-count" style="font-weight: 600; color: var(--base-white);">0</span>
                            groups found
                        </span>
                    </div>
                    <select id="sort-select" class="input" style="width: auto; padding: 8px 14px; font-size: 14px;">
                        <option value="best-match">Best Match</option>
                        <option value="nearest">Nearest</option>
                        <option value="most-active">Most Active</option>
                    </select>
                </div>

                <!-- In-Radius Groups -->
                <section id="in-radius-section">
                    <h3 style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 20px;">
                        Groups within <span id="radius-display-1" style="color: var(--primary-500);">5</span> km
                        <span id="in-radius-count" class="badge"
                            style="background: var(--surface-200); color: var(--text-muted); font-size: 12px; padding: 4px 10px;">0</span>
                    </h3>
                    <div id="in-radius-groups" class="groups-grid"
                        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
                        <!-- Cards will be populated here -->
                    </div>
                </section>

                <!-- Out-of-Radius Groups -->
                <section id="out-radius-section" style="margin-top: 48px; display: none;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h3 style="display: flex; align-items: center; gap: 10px; font-size: 20px;">
                            Other groups (outside <span id="radius-display-2"
                                style="color: var(--primary-500);">5</span> km)
                            <span id="out-radius-count" class="badge"
                                style="background: var(--surface-200); color: var(--text-muted); font-size: 12px; padding: 4px 10px;">0</span>
                        </h3>
                        <button id="toggle-out-radius" class="btn btn-secondary btn-sm">
                            Show more
                        </button>
                    </div>
                    <p class="text-muted" style="font-size: 14px; margin-bottom: 20px;">
                        Outside your radius but might still fit
                    </p>
                    <div id="out-radius-groups" class="groups-grid"
                        style="display: none; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
                        <!-- Cards will be populated here -->
                    </div>
                </section>

                <!-- Empty State -->
                <div id="no-results" style="display: none; text-align: center; padding: 64px 24px;">
                    <div style="font-size: 56px; margin-bottom: 20px;">🔍</div>
                    <h3 style="margin-bottom: 12px; font-size: 22px;">No groups found</h3>
                    <p class="text-muted" style="margin-bottom: 28px; font-size: 15px;">
                        Try adjusting your filters or expanding your radius
                    </p>
                    <div id="suggestions" style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
                        <!-- Suggestions will be added here -->
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loading-state" style="text-align: center; padding: 64px;">
                    <div style="font-size: 40px; margin-bottom: 16px;">⏳</div>
                    <p class="text-muted" style="font-size: 15px;">Loading groups...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Create FAB -->
    <a href="create-group.html" class="btn btn-primary"
        style="position: fixed; bottom: 32px; right: 32px; box-shadow: var(--shadow-lg); border-radius: var(--radius-full); width: 56px; height: 56px; padding: 0; font-size: 24px; z-index: 90; display: flex; align-items: center; justify-content: center; text-decoration: none;">+</a>

    <!-- Scripts -->
    <script type="module" src="../js/app.js"></script>
</body>

</html>
