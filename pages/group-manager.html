<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Manager | ECA-Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { font-family: 'Inter', sans-serif; }

        .gm-nav {
            background: var(--surface-50);
            padding: 16px 24px;
            border-bottom: 1px solid var(--surface-200);
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .gm-nav .brand { font-weight: 700; color: var(--base-white); font-size: 18px; margin-right: auto; }

        .gm-wrapper { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }

        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; color: var(--base-white); margin-bottom: 6px; }
        .page-header p { color: var(--text-muted); font-size: 14px; }

        /* Group accordion */
        .group-block {
            background: var(--surface-100);
            border: 1px solid var(--surface-200);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .group-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            cursor: pointer;
            user-select: none;
        }
        .group-block-header:hover { background: var(--surface-150); }
        .group-block-title { font-weight: 600; font-size: 16px; color: var(--base-white); }
        .group-block-meta { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--text-muted); }
        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-count {
            background: var(--primary-500);
            color: white;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }
        .group-block-body { display: none; border-top: 1px solid var(--surface-200); }
        .group-block-body.open { display: block; }

        /* Request cards */
        .request-card {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            gap: 16px;
            align-items: start;
            padding: 20px 24px;
            border-bottom: 1px solid var(--surface-200);
        }
        .request-card:last-child { border-bottom: none; }
        .req-avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: var(--primary-500);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: white;
            flex-shrink: 0;
        }
        .req-name { font-weight: 600; color: var(--base-white); font-size: 15px; margin-bottom: 4px; }
        .req-email-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--text-muted); margin-bottom: 8px;
        }
        .copy-btn {
            background: none; border: none;
            color: var(--primary-400); cursor: pointer; font-size: 12px;
            padding: 2px 6px; border-radius: 4px;
            transition: background 0.15s;
        }
        .copy-btn:hover { background: var(--primary-50); }
        .req-message {
            font-size: 13px; color: var(--text-description);
            background: var(--surface-200); padding: 8px 12px; border-radius: 8px;
            margin-top: 6px; font-style: italic;
        }
        .req-timestamp { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
        .req-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; min-width: 130px; }
        .req-status-badge {
            font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 600;
        }
        .status-pending { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .status-approved { background: rgba(16,185,129,0.12); color: #10b981; }
        .status-rejected { background: rgba(239,68,68,0.12); color: #ef4444; }

        /* Empty state */
        .empty-state {
            text-align: center; padding: 40px 24px;
            color: var(--text-muted); font-size: 14px;
        }
        .empty-state .icon { font-size: 36px; margin-bottom: 12px; }

        /* Tabs */
        .tab-bar { display: flex; gap: 4px; margin-bottom: 8px; padding: 12px 24px 0; }
        .tab-btn {
            padding: 6px 16px; border-radius: 8px; border: none;
            background: none; color: var(--text-muted); cursor: pointer;
            font-size: 13px; font-weight: 500; transition: all 0.15s;
        }
        .tab-btn.active { background: var(--surface-200); color: var(--base-white); }

        /* Notification badge in nav */
        .notif-badge {
            background: #ef4444; color: white;
            font-size: 10px; font-weight: 700;
            padding: 1px 5px; border-radius: 10px;
            position: relative; top: -8px; left: -6px;
        }

        /* Loading */
        .loading-state { text-align: center; padding: 64px; color: var(--text-muted); font-size: 15px; }
    </style>
</head>

<body>
    <nav class="gm-nav">
        <div class="brand">ECA-Connect</div>
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
        
        <!-- Notification Bell & Dropdown -->
        <div class="notification-wrapper" style="position:relative;">
            <button class="icon-btn" id="notification-bell" style="background:none; border:none; font-size: 20px; cursor: pointer; position:relative;">
                🔔
                <span class="badge nav-badge-pulse" id="notification-badge" style="display: none; position:absolute; top:-4px; right:-4px; background:var(--error); color:white; font-size:10px; padding:2px 6px; border-radius:10px;">0</span>
            </button>
            <div class="notification-dropdown" id="notification-dropdown" style="display:none; position:absolute; right:0; top:40px; width:320px; background:var(--surface-50); border:1px solid var(--surface-200); border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.5); z-index:1000;">
                <div class="dropdown-header" style="padding:12px; border-bottom:1px solid var(--surface-200); display:flex; justify-content:space-between; align-items:center;">
                    <h4 style="margin:0; color:var(--base-white); font-size:14px;">Notifications</h4>
                    <button class="text-btn" id="mark-all-read-btn" style="background:none; border:none; color:var(--primary-400); font-size:12px; cursor:pointer;">Mark all read</button>
                </div>
                <div class="dropdown-content" id="notification-list" style="max-height:300px; overflow-y:auto; padding:8px;">
                    <div class="empty-state" style="text-align:center; padding:20px; color:var(--text-muted);">
                        <div class="icon" style="font-size:24px; margin-bottom:8px;">📭</div>
                        <p style="margin:0; font-size:13px;">No new notifications</p>
                    </div>
                </div>
            </div>
        </div>

        <a href="profile.html" class="btn btn-ghost btn-sm">👤 Profile</a>
    </nav>

    <div class="gm-wrapper">
        <div class="page-header">
            <h1>👑 Group Manager</h1>
            <p>Review and approve join requests for groups you created.</p>
        </div>

        <div id="loading-state" class="loading-state">
            <div style="font-size: 36px; margin-bottom: 12px;">⏳</div>
            Loading your groups...
        </div>

        <div id="no-groups-state" style="display:none;" class="empty-state">
            <div class="icon">📭</div>
            <p>You haven't created any groups yet.</p>
            <a href="create-group.html" class="btn btn-primary" style="margin-top: 16px;">Create a Group</a>
        </div>

        <div id="groups-container" style="display:none;"></div>
    </div>

    <!-- Profile Preview Modal -->
    <div id="profile-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; overflow-y:auto;">
        <div style="background:var(--surface-100); border:1px solid var(--surface-200); border-radius:16px; width:90%; max-width:520px; margin:40px auto; padding:32px; position:relative;">
            <button id="close-profile-modal" style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-muted);font-size:24px;cursor:pointer;">✕</button>
            <div id="profile-modal-content">Loading...</div>
        </div>
    </div>

    <script type="module" src="../js/group-manager.js"></script>
    <script type="module" src="../js/notification-dropdown.js"></script>
    <script type="module" src="../js/theme-toggle.js"></script>
</body>
</html>
